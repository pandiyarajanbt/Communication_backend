<!doctype html>
<html>
  <head>
    <style>
      body {
        height: 100%;
        margin: 0;
        width: 100%;
        overflow: hidden;
      }
      #graphiql {
        height: 100vh;
      }

      .graphiql-container .topBar,
      .graphiql-container .title,
      .graphiql-container .execute-button {
        color: rgb(0, 0, 0);
      }

      .graphiql-container .toolbar,
      .graphiql-container .docExplorerWrap,
      .graphiql-container .historyPaneWrap {
        background: #ffffff;
      }
    </style>
    <script
      crossorigin
      src="https://unpkg.com/react@16/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@16/umd/react-dom.development.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/graphiql@0.17.5/graphiql.css"
    />
    <script src="https://unpkg.com/graphiql@0.17.5/graphiql.min.js"></script>
  </head>
  <body>
    <div id="graphiql">Loading...</div>
    <script>
      const graphQLFetcher = (graphQLParams) =>
        fetch("/graphql/", {
          method: "post",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(graphQLParams),
        })
          .then((response) => response.json())
          .catch((error) => ({
            errors: [{ message: error.message || "GraphQL request failed" }],
          }));

      ReactDOM.render(
        React.createElement(GraphiQL, { fetcher: graphQLFetcher }),
        document.getElementById("graphiql"),
      );
    </script>
  </body>
</html>
